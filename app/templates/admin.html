<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAid - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="has-nav" data-token="{{token}}">
    <div class="background-animation"></div>
    <header class="site-header">
        <div class="header-content">
            <h1><i class="fas fa-hands-helping"></i> FastAid</h1>
            <div class="header-right">
                <nav>
                    <ul>
                        <li><a href="admin.html?token={{token}}" class="nav-link active" data-page="admin" data-i18n="admin_title">Administration</a></li>
                    </ul>
                </nav>
                <div class="lang-switch">
                    <button id="langEn" type="button">EN</button>
                    <button id="langFr" type="button">FR</button>
                </div>
            </div>
        </div>
    </header>
    <div class="container">
        <main>
            <h2 data-i18n="admin_title">Administration</h2>

            <div class="admin-tabs">
                <button type="button" class="active" data-tab="users" data-i18n="admin_users">Users</button>
                <button type="button" data-tab="requests" data-i18n="admin_requests">Requests</button>
                <button type="button" data-tab="map" data-i18n="admin_map">Activity Map</button>
            </div>

            <section id="tabUsers" class="admin-section active card">
                <h3 data-i18n="admin_create_user">Create User</h3>
                <form id="createUserForm" class="admin-form">
                    <input type="text" name="username" data-i18n-placeholder="admin_username" placeholder="Username" required>
                    <input type="password" name="password" data-i18n-placeholder="admin_password" placeholder="Password" required>
                    <input type="text" name="displayName" data-i18n-placeholder="admin_display_name" placeholder="Display Name" required>
                    <input type="text" name="phone" data-i18n-placeholder="admin_phone" placeholder="Phone" required>
                    <select name="profession">
                        <option value="">—</option>
                        <option value="paramedic">paramedic</option>
                        <option value="mechanic">mechanic</option>
                        <option value="plumber">plumber</option>
                        <option value="electrician">electrician</option>
                        <option value="locksmith">locksmith</option>
                        <option value="heating_technician">heating_technician</option>
                        <option value="veterinarian">veterinarian</option>
                    </select>
                    <label><input type="checkbox" name="canRequest" checked> <span data-i18n="admin_can_request">Can Request</span></label>
                    <label><input type="checkbox" name="canHelp"> <span data-i18n="admin_can_help">Can Help</span></label>
                    <input type="text" name="address" data-i18n-placeholder="admin_address" placeholder="Address">
                    <input type="number" step="any" name="lng" data-i18n-placeholder="admin_lng" placeholder="Longitude">
                    <input type="number" step="any" name="lat" data-i18n-placeholder="admin_lat" placeholder="Latitude">
                    <button type="submit" class="primary-btn" data-i18n="admin_save">Save</button>
                </form>
                <div class="table-wrapper">
                    <table class="data-table" id="usersTable">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th data-i18n="admin_display_name">Display Name</th>
                                <th data-i18n="admin_phone">Phone</th>
                                <th data-i18n="admin_profession">Profession</th>
                                <th data-i18n="admin_can_request">Can Request</th>
                                <th data-i18n="admin_can_help">Can Help</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section id="tabRequests" class="admin-section card">
                <div class="table-wrapper">
                    <table class="data-table" id="requestsTable">
                        <thead>
                            <tr>
                                <th data-i18n="requester">Requester</th>
                                <th data-i18n="helper">Helper</th>
                                <th data-i18n="category">Category</th>
                                <th data-i18n="status">Status</th>
                                <th data-i18n="location">Location</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section id="tabMap" class="admin-section card">
                <ul class="legend">
                    <li><span class="legend-dot legend-pending"></span> <span data-i18n="map_legend_pending">Pending requests</span></li>
                    <li><span class="legend-dot legend-active"></span> <span data-i18n="map_legend_active">Active requests</span></li>
                    <li><span class="legend-dot legend-completed"></span> <span data-i18n="map_legend_completed">Completed requests</span></li>
                </ul>
                <div id="adminMap" data-mapboxtoken="{{ mapboxToken }}"></div>
            </section>
        </main>
        <footer>
            <p>© 2025 FastAid | <span data-i18n="footer">Built with care by Alexandre Nasrallah</span></p>
        </footer>
    </div>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/admin.js" defer></script>
</body>
</html>
